#version: '3.8'

services:
  server:
    build: ./server
    container_name: portfolio-api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      default:
      tunnel_net:
        aliases:
          - site1-api
    volumes:
      # Mount the persistent volume to the correct path inside the container
      - server_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - API_SERVER_URL=${API_SERVER_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DB_HOST=db
      - DB_USER=${PORTFOLIO_DB_USER:-myuser}
      - DB_PASSWORD=${PORTFOLIO_DB_PASSWORD:-password}
      - DB_NAME=${PORTFOLIO_DB_NAME:-portfolio_db}
      - DB_PORT=5432
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: portfolio-web-client
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API container directly; going out
      # through the public hostname would leave the tunnel and come back.
      - INTERNAL_API_URL=http://server:3001/api
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      default:
      tunnel_net:
        aliases:
          - site1
    depends_on:
      - server
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  photo-worker:
    build: ./worker
    container_name: portfolio-photo-worker
    restart: unless-stopped
    environment:
      - API_SERVER_URL=${API_SERVER_URL}
      - DB_HOST=db
      - DB_USER=${PORTFOLIO_DB_USER:-myuser}
      - DB_PASSWORD=${PORTFOLIO_DB_PASSWORD:-password}
      - DB_NAME=${PORTFOLIO_DB_NAME:-portfolio_db}
      - DB_PORT=5432
      - UPLOADS_DIR=/app/uploads
      - WORKER_POLL_MS=5000
      - WORKER_BATCH=5
      - KEEP_RAW=false
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:15-alpine
    container_name: portfolio-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PORTFOLIO_DB_USER:-myuser}
      - POSTGRES_PASSWORD=${PORTFOLIO_DB_PASSWORD:-password}
      - POSTGRES_DB=${PORTFOLIO_DB_NAME:-portfolio_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  server_uploads:

networks:
  tunnel_net:
    external: true
